<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - RB3Enhanced Companion</title>
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="topbar">
    <div>
      <h1><img class="logo" src="/static/images/rb3enhanced_logo.png" alt="RB3Enhanced"> Companion</h1>
      <p class="subtitle">Settings</p>
    </div>
    <a class="back-link" href="/">&larr; Back</a>
  </div>

  <div class="card">
    <div class="setting-row">
      <div class="setting-label">Theme</div>
      <p class="setting-help">Choose how the Companion looks on this device.</p>
      <div class="theme-options" id="theme-options">
        <button class="theme-option" data-theme-value="system">System</button>
        <button class="theme-option" data-theme-value="light">Light</button>
        <button class="theme-option" data-theme-value="dark">Dark</button>
      </div>
    </div>
  </div>

  <script src="/static/js/config.js"></script>
</body>
</html>
