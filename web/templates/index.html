<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RB3Enhanced Companion</title>
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="topbar">
    <h1><img class="logo" src="/static/images/rb3enhanced_logo.png" alt="RB3Enhanced"> Companion</h1>
    <div class="topbar-right">
      <span class="status off" id="topbar-status" title="Waiting for RB3Enhanced..."></span>
      <a class="gear-link" href="/config" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </div>
  </div>

  <div class="card" id="player-card" hidden>
    <div class="stagekit" id="stagekit">
      <!-- 8 positions x 4 colours (R,G,B,Y), filled in by app.js -->
    </div>
    <div class="sk-strobe-row">
      <div class="sk-strobe" id="sk-strobe"></div>
    </div>

    <div id="current-song" class="song-row current-song" hidden>
      <div class="song-info">
        <img class="album-art album-art-lg" id="current-song-art" alt="" hidden>
        <div class="song-details">
          <span class="song-title" id="current-song-title"></span>
          <span class="song-artist" id="current-song-artist"></span>
        </div>
      </div>
      <img class="origin-icon" id="current-song-origin" alt="" hidden>
    </div>

    <dl id="venue-info" hidden>
      <dt>Venue</dt><dd id="venue-name"></dd>
    </dl>

    <table id="band-table" hidden>
      <thead><tr><th>Slot</th><th>Track</th><th>Difficulty</th></tr></thead>
      <tbody id="band-rows"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="search-row">
      <input id="searchbox" type="text" placeholder="Search songs, artists, albums...">
      <button class="icon-button" id="filters-button" type="button" title="Filters" aria-label="Filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path>
        </svg>
      </button>
    </div>
    <ul id="songlist">
      <li class="song-message">Waiting for the song list&hellip; enter the Music Library to load it.</li>
    </ul>
  </div>

  <div class="modal-overlay" id="filters-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="filters-title">
      <div class="modal-header">
        <h2 id="filters-title">Filters</h2>
        <button class="icon-button" id="filters-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="filter-section">
          <label class="filter-section-label" for="sort-order-select">Sort Order</label>
          <select id="sort-order-select">
            <option value="title">Song Name</option>
            <option value="artist">Artist</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
