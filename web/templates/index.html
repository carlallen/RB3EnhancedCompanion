<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RB3Enhanced Companion</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; background: #000; color: #fff; }
    h1 { font-size: 1.4rem; }
    .card { border: 1px solid #8884; border-radius: 0.5rem; padding: 1.25rem; margin-top: 1rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .topbar h1 { margin: 0; display: flex; align-items: center; gap: 0.5rem; }
    .topbar h1 .logo { height: 1.8rem; width: auto; }
    .muted { opacity: 0.6; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1><img class="logo" src="/static/images/rb3enhanced_logo.png" alt="RB3Enhanced"> Companion</h1>
  </div>

  <div class="card">
    <p class="muted">Companion server for Rock Band 3 Deluxe + RB3Enhanced.</p>
  </div>
</body>
</html>
